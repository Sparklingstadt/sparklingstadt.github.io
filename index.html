<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sparklingstadt — moved</title>
  <link rel="canonical" href="https://sparklingstadt.github.io/portfolio/">
  <meta http-equiv="refresh" content="0; url=/portfolio/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // The main page now has one URL per language. Pick the language the old
    // site would have shown: the saved choice (same origin, so the same
    // localStorage), then the browser language, then Japanese.
    (() => {
      const pages = { ja: "", en: "en/", zh: "zh/" };
      let language = null;
      try { language = localStorage.getItem("language"); } catch { /* Storage is optional. */ }
      if (!(language in pages)) {
        language = (navigator.languages || [navigator.language])
          .map((tag) => String(tag).toLowerCase().split("-")[0])
          .find((code) => code in pages) || "ja";
      }
      location.replace("/portfolio/" + pages[language] + location.hash);
    })();
  </script>
</head>
<body>
  <p>このサイトは移転しました / This site has moved: <a href="/portfolio/">https://sparklingstadt.github.io/portfolio/</a></p>
</body>
</html>
