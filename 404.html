<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sparklingstadt — moved</title>
  <link rel="canonical" href="https://sparklingstadt.github.io/portfolio/">
  <meta http-equiv="refresh" content="0; url=/portfolio/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Any other old URL: try the same path on the new site. Paths already
    // under /portfolio/ stay put so a missing page there cannot loop.
    (() => {
      const path = location.pathname;
      const target = path.startsWith("/portfolio/") ? null : "/portfolio" + path;
      if (target) location.replace(target + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>このサイトは移転しました / This site has moved: <a href="/portfolio/">https://sparklingstadt.github.io/portfolio/</a></p>
</body>
</html>
